version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campus_booking_db
    restart: always
    environment:
      POSTGRES_DB: campus_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_booking_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: campus_booking
    depends_on:
      - db

volumes:
  pgdata:
